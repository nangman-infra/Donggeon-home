server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Next.js build assets are content-hashed and can be cached for a year.
    location ^~ /_next/static/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never route a missing asset request to the HTML fallback.
    location ~* \.(?:css|js|mjs|json|xml|ico|svg|webp|avif|png|jpg|jpeg|gif|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Static route payloads are deployment-specific and should be revalidated.
    location ~* \.txt$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    # HTML may change on each deploy and should be revalidated.
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
